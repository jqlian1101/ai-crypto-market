[project]
name = "aicrypto-market"
version = "0.1.0"
description = "AI Crypto Market Intelligence & Analysis Platform - backend"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # data
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    # observability
    "structlog>=24.4",
    "prometheus-client>=0.21",
    # orchestration
    "apscheduler>=3.10",
    "httpx>=0.28",
    "websockets>=13.1",
    "langgraph>=1.2",
    # utilities
    "ulid-py>=1.1",
]
# 注（L-30）：以下依赖曾被声明却**零 import**，已删除——
#   python-multipart  —— 无任何表单上传端点（PRD 无 form-data 需求）；
#   tenacity         —— 重试逻辑由 services/llm_retry.py 自实现（需精确控制退避与总预算）；
#   tomli-w          —— 无 TOML 写回需求（只读 config/base.toml）；
#   asyncpg/greenlet —— 原属 [postgres] extra，但后端明确用**同步** psycopg3
#                        （README 技术选型：同步栈更适合批处理语义），
#                        且 SQLAlchemy 只在 URL 方言里引用 `postgresql+psycopg`。
# 由 tests/unit/test_dependency_usage.py 的 CI 对账**强制**：
# 声明的依赖必须至少有一处消费方，否则 CI 直接失败。

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
    # 注意：**不要**装 types-redis。redis-py 自 4.2 起就自带 `py.typed`，
    # 而 types-redis 的存根是 2024-10 的旧快照，缺少 `aclose()`，
    # 会**遮蔽** redis 自带的类型 —— mypy 会报
    # `"Redis[Any]" has no attribute "aclose"`。
    "types-requests>=2.32",
    "alembic>=1.14",
]
# 注（L-30）：原 `[postgres]` extra（asyncpg / greenlet）已删除——
# 后端用同步 psycopg3，异步驱动从未被使用。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicrypto"]

[tool.uv]
package = true

# --- ruff (36.7) ---
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # 行宽由 formatter 处理
    "B008",   # FastAPI Depends() 默认值是惯用写法
    "RUF001", # 允许中文全角标点
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "N802"]
"migrations/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["aicrypto"]

# --- mypy (36.7) ---
[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# apscheduler 未随包提供类型 stubs；仅对该第三方包放宽导入检查，不影响项目自身代码。
module = ["apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aicrypto.domain.market_intelligence.*", "aicrypto.domain.evaluation.*"]
disallow_untyped_defs = true
disallow_untyped_calls = true
warn_return_any = true

# --- pytest (36.1/36.2) ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
# 显式声明 event loop 作用域，避免 pytest-asyncio 的
# "asyncio_default_fixture_loop_scope is unset" 警告（未来版本会变更默认值）。
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: 纯函数单元测试",
    "contract: API 契约测试",
    "integration: 集成测试",
    "e2e: 端到端测试",
    "replay: 异动规则回放测试",
]
filterwarnings = ["error::DeprecationWarning:aicrypto.*"]

[tool.coverage.run]
source = ["src/aicrypto"]
branch = true

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
