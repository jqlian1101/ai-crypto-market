[project]
name = "aicrypto-market"
version = "0.1.0"
description = "AI Crypto Market Intelligence & Analysis Platform - backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    # data
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    # observability
    "structlog>=24.4",
    "prometheus-client>=0.21",
    # orchestration
    "apscheduler>=3.10",
    "httpx>=0.28",
    "websockets>=13.1",
    "langgraph>=0.2",
    # utilities
    "ulid-py>=1.1",
    "tenacity>=9.0",
    "tomli-w>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis>=4.6",
    "types-requests>=2.32",
    "alembic>=1.14",
]
postgres = [
    "asyncpg>=0.30",
    "greenlet>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicrypto"]

[tool.uv]
package = true

# --- ruff (36.7) ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # 行宽由 formatter 处理
    "B008",   # FastAPI Depends() 默认值是惯用写法
    "RUF001", # 允许中文全角标点
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "N802"]
"migrations/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["aicrypto"]

# --- mypy (36.7) ---
[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aicrypto.domain.market_intelligence.*", "aicrypto.domain.evaluation.*"]
disallow_untyped_defs = true
disallow_untyped_calls = true
warn_return_any = true

# --- pytest (36.1/36.2) ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: 纯函数单元测试",
    "contract: API 契约测试",
    "integration: 集成测试",
    "e2e: 端到端测试",
    "replay: 异动规则回放测试",
]
filterwarnings = ["error::DeprecationWarning:aicrypto.*"]

[tool.coverage.run]
source = ["src/aicrypto"]
branch = true

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
