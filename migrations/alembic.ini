[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
# Filename template: NNNN_<snake_case_description>.py (PRD 36.8)
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

# NOTE: keep this file ASCII-only.
# Alembic parses it with configparser(encoding="locale"), which on a CJK
# Windows locale (cp936) cannot decode non-ASCII bytes and raises
# UnicodeDecodeError. Put Chinese comments in the migration scripts instead.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
