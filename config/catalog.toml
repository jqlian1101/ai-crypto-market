# 机器可读的配置目录（PRD 第 32.5 节）
#
# 要求：任何新配置项必须同时出现在
#   1. 本文件
#   2. .env.example（敏感项）
#   3. PRD_TDD.md 第 32.4 章对应小节
#   4. src/aicrypto/config/settings.py 的 Settings 模型
#
# CI（tests/unit/test_config_catalog.py）遍历 Settings 的全部字段，断言每个字段都在本文件中登记，
# 且 type / default / sensitive 与模型一致。
#
# 字段说明：
#   type        —— 声明类型；与模型字段类型做映射比对
#   default     —— 默认值（字符串形式）；敏感项为 null
#   sensitive   —— 是否敏感（true 时必须在 .env.example 中出现且值为空）
#   prd_section —— PRD 第 32.4 章的小节标题

# ---------- 32.4 应用基础 ----------
[app.base]
APP_ENV = { type = "string", default = "local", sensitive = false, prd_section = "应用基础" }
